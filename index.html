  const go=()=>{ EX[k](); resetRuntime(); sel=null; linkFrom=null; save(); render(); renderInsp(); fitView(); toast(`Caricato: ${label}`); };
  if(!S.devices.length){ go(); return; }
  modal(`<h3>Sostituire la rete attuale?</h3><p class="note">Stai per caricare "${esc(label)}". La rete che hai sullo schermo verrà sostituita. Se ti serve, esportala prima.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Annulla</button><button class="btn pri" id="mOk">Carica</button></div>`,m=>m.querySelector('#mOk').addEventListener('click',()=>{ modalRoot.innerHTML=''; go(); }));
});
document.getElementById('bDiag').addEventListener('click',()=>{ sel=null; render(); renderInsp(); const sec=document.getElementById('diagSec'); if(sec){ insp.scrollTop=0; sec.scrollIntoView({behavior:'smooth',block:'nearest'}); } });
document.getElementById('bUndo').addEventListener('click',undo);
function updExercise(){ const on=!!S.exercise; document.getElementById('bDiag').hidden=on; document.getElementById('exChip').hidden=!on; }
document.getElementById('exChip').addEventListener('click',()=>{
  modal(`<h3>Disattivare la modalità esercizio?</h3><p class="note">Tornano il pulsante Verifica rete e le spiegazioni «Perché» nel terminale. In un esercizio di ricerca guasti mostrano subito gli errori.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Annulla</button><button class="btn pri" id="mOff">Disattiva</button></div>`,m=>m.querySelector('#mOff').addEventListener('click',()=>{ delete S.exercise; save(); render(); renderInsp(); modalRoot.innerHTML=''; toast('Modalità esercizio disattivata.'); }));
});
document.getElementById('bCap').addEventListener('click',()=>{ if(!lastCap) return;
  const nm=id=>{ const x=dev(id); return x?esc(x.name):'?'; };
  const mac=m=>{ if(!m) return '—'; const o=macOwner(m); return `<span title="${o?esc(o.d.name+' '+o.f.name):''}">${macWin(m)}</span>`; };
  const body=lastCap.items.map(it=>{ const t=it.t; let rows='';
    t.frames.forEach(fr=>{
      if(fr.arp){ const hosts=fr.arp.domain.filter(id=>dev(id)&&dev(id).type!=='switch'), sws=fr.arp.domain.filter(id=>dev(id)&&dev(id).type==='switch');
        rows+=`<tr class="arp"><td colspan="5"><b>ARP</b>: ${nm(fr.from)} chiede in broadcast «chi ha ${i2ip(fr.arp.ip)}?» (MAC destinazione FF-FF-FF-FF-FF-FF). ${sws.length?`Gli switch ${sws.map(nm).join(', ')} la inoltrano su tutte le porte. `:''}La ricevono: ${hosts.length?hosts.map(nm).join(', '):'nessuno'}. ${fr.arp.answered?`Risponde ${nm(fr.arp.answered)} con il suo MAC.`:'Nessuno risponde.'}</td></tr>`; }
      if(fr.to) rows+=`<tr><td class="tr">${[fr.from,...fr.via,fr.to].map(nm).join(' → ')}</td><td>${mac(fr.smac)}</td><td>${mac(fr.dmac)}</td><td>${i2ip(fr.sip)}</td><td>${i2ip(fr.dip)}</td></tr>`;
    });
    if(!t.ok) rows+=`<tr class="fail"><td colspan="5">${S.exercise?`Il pacchetto non prosegue oltre ${nm(t.where)}.`:esc(t.msg)}</td></tr>`;
    if(!rows) rows='<tr><td colspan="5" class="tr">Nessun frame: la destinazione è il dispositivo stesso.</td></tr>';
    return `<h4>${esc(it.label)}</h4><div class="twrap"><table class="tbl cap"><thead><tr><th>Tratto</th><th>MAC sorgente</th><th>MAC destinazione</th><th>IP sorgente</th><th>IP destinazione</th></tr></thead><tbody>${rows}</tbody></table></div>`; }).join('');
  modal(`<h3>Pacchetti di «${esc(lastCap.cmd)}» da ${esc(lastCap.dev)}</h3><p class="note">Una riga per ogni tratto tra due dispositivi che lavorano con l'IP. Gli switch inoltrano il frame senza modificarlo. Passa il mouse su un MAC per vedere a chi appartiene. Nel ping si mostra solo il primo dei pacchetti inviati.</p>${body}<div class="row" style="justify-content:flex-end"><button class="btn pri" data-close>Chiudi</button></div>`);
  modalRoot.querySelector('.box').classList.add('wide');
});
document.getElementById('bExp').addEventListener('click',()=>{
  const txt=JSON.stringify(S);
  modal(`<h3>Esporta la rete</h3><p class="note">Copia questo testo${CAN_DL?' oppure scarica il file':''} e consegnalo come compito: con Importa la rete si ricarica identica.</p>
    <label class="chk"><input type="checkbox" id="mEx" ${S.exercise?'checked':''}> Modalità esercizio: chi apre la rete non vede «Verifica rete» né le spiegazioni dei guasti</label>
    <textarea id="mTxt" readonly>${esc(txt)}</textarea>
    ${CAN_DL?`<div class="fgrid"><label for="mName">Nome del file</label><input class="inp" id="mName" value="${esc(lastFileName)}" placeholder="Cognome_Es3"></div>`:''}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Chiudi</button>${CAN_DL?'<button class="btn" id="mDl">Scarica file .json</button>':''}<button class="btn pri" id="mCopy">Copia</button></div>`,m=>{
    m.querySelector('#mEx').addEventListener('change',e=>{ if(e.target.checked) S.exercise=true; else delete S.exercise; save(); render(); renderInsp(); m.querySelector('#mTxt').value=JSON.stringify(S); });
    const dl=m.querySelector('#mDl'); if(dl) dl.addEventListener('click',()=>{ try{ const nmI=m.querySelector('#mName'); lastFileName=(nmI&&nmI.value.trim().replace(/\.json$/i,'').replace(/[\\/:*?"<>|]+/g,'_'))||'rete'; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download=lastFileName+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }catch(err){ toast('Download non riuscito: usa Copia.','err'); } });
    m.querySelector('#mCopy').addEventListener('click',()=>{ const ta=m.querySelector('#mTxt'); navigator.clipboard.writeText(ta.value).then(()=>toast('Copiato negli appunti.')).catch(()=>{ ta.focus(); ta.select(); toast('Testo selezionato: premi Ctrl+C.'); }); });
  });
});
document.getElementById('bImp').addEventListener('click',()=>{
  modal(`<h3>Importa una rete</h3><p class="note">Incolla il testo ottenuto con Esporta oppure apri un file .json. La rete attuale verrà sostituita.</p><textarea id="mTxt" placeholder='{"devices":[...],"links":[...]}'></textarea><div class="row"><label class="btn" for="mFile">Apri un file .json…</label><input type="file" id="mFile" accept=".json,application/json,text/plain" hidden></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Annulla</button><button class="btn pri" id="mLoad">Importa</button></div>`,m=>{
    m.querySelector('#mFile').addEventListener('change',ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ m.querySelector('#mTxt').value=r.result; m.querySelector('#mLoad').click(); }; r.readAsText(f); });
    m.querySelector('#mLoad').addEventListener('click',()=>{ try{ const o=JSON.parse(m.querySelector('#mTxt').value); if(!o||!Array.isArray(o.devices)) throw 0; loadState(o); resetRuntime(); save(); render(); renderInsp(); fitView(); modalRoot.innerHTML=''; toast('Rete importata.'); }catch(err){ toast('Il testo non è una rete valida: controlla di averlo copiato per intero.','err'); } });
  });
});

/* ---------- boot ---------- */
(function(){
  let ok=false;
  try{ const raw=localStorage.getItem(KEY)||localStorage.getItem('banco-di-rete.v1'); if(raw){ const o=JSON.parse(raw); if(o&&Array.isArray(o.devices)){ loadState(o); ok=true; } } }catch(e){}
  if(!ok) exHome();
  render(); renderInsp(); fitView(); resetHistory(); lastAspect=aspect();
})();
</script>

</body>
</html>
